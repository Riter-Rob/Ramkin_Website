name: Deploy to GitHub Pages (CI/CD)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HTML files exist
        run: |
          echo "=== Files to deploy ==="
          ls -la
          test -f index.html || { echo "❌ index.html missing!"; exit 1; }
          test -f styles.css || { echo "❌ styles.css missing!"; exit 1; }
          test -f script.js || { echo "❌ script.js missing!"; exit 1; }
          echo "✅ All required files present"

      - name: Set up Node.js (for HTML/CSS linting)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g --silent html-validate stylelint stylelint-config-standard

      - name: Run stylelint on styles.css
        continue-on-error: true
        run: |
          echo '{ "extends": "stylelint-config-standard", "rules": { "no-descending-specificity": null, "alpha-value-notation": null, "color-function-notation": null, "hue-degree-notation": null, "font-family-name-quotes": null, "declaration-block-no-redundant-longhand-properties": null, "keyframes-name-pattern": null, "selector-class-pattern": null, "custom-property-pattern": null, "property-no-vendor-prefix": null, "value-no-vendor-prefix": null, "number-max-precision": null, "selector-not-notation": null, "media-feature-range-notation": null, "annotation-no-unknown": [true, { "ignoreAnnotations": ["default"] }] } }' > .stylelintrc.json
          npx stylelint styles.css --allow-empty-input || echo "Stylelint reported issues (non-blocking)"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
