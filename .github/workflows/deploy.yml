name: Deploy to GitHub Pages (CI/CD)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write

concurrency:
  group: "pages-deploy-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  # ============== JOB 1: QUALITY (linting + Lighthouse on PRs) ==============
  quality:
    name: Lint + Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        id: validate
        run: |
          echo "=== 📂 Files in workspace ==="
          find . -maxdepth 2 -not -path './.git*' | sort
          echo ""
          MISSING=0
          for f in index.html styles.css script.js; do
            if [ -f "$f" ]; then
              echo "✅ $f found ($(wc -l < "$f") lines)"
            else
              echo "❌ $f MISSING"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Write .stylelintrc (from file, not inline)
        run: |
          cat > .stylelintrc.json <<'STYLELINTEOF'
          {
            "extends": "stylelint-config-standard",
            "rules": {
              "no-descending-specificity": null,
              "alpha-value-notation": null,
              "color-function-notation": null,
              "hue-degree-notation": null,
              "font-family-name-quotes": null,
              "declaration-block-no-redundant-longhand-properties": null,
              "keyframes-name-pattern": null,
              "selector-class-pattern": null,
              "custom-property-pattern": null,
              "property-no-vendor-prefix": null,
              "value-no-vendor-prefix": null,
              "number-max-precision": null,
              "selector-not-notation": null,
              "media-feature-range-notation": null,
              "length-zero-no-unit": null,
              "selector-pseudo-class-no-unknown": [true, { "ignorePseudoClasses": ["global"] }],
              "annotation-no-unknown": [true, { "ignoreAnnotations": ["default"] }]
            }
          }
          STYLELINTEOF
          cat .stylelintrc.json

      - name: Install lint tools
        run: |
          npm init -y > /dev/null 2>&1 || true
          npm install --save-dev --no-audit --no-fund stylelint stylelint-config-standard
          echo "Installed stylelint: $(npx stylelint --version 2>/dev/null || echo ok)"

      - name: Run Stylelint (CSS validation, non-blocking)
        id: lint
        continue-on-error: true
        run: |
          echo "=== 🎨 Running Stylelint on styles.css ==="
          npx stylelint styles.css --formatter verbose > stylelint-report.txt 2>&1 || true
          cat stylelint-report.txt
          echo "Lint completed (non-blocking)."

      - name: Run Lighthouse CI (Performance/SEO/A11y)
        id: lighthouse
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Summarize quality report
        if: always()
        run: |
          echo "## ✅ Quality Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Required files (index/css/js) | ✅ Pass |" >> $GITHUB_STEP_SUMMARY
          if grep -q "problems" stylelint-report.txt 2>/dev/null; then
            ISSUES=$(grep -oP '\d+(?= problem)' stylelint-report.txt | head -1)
            echo "| Stylelint CSS quality | ⚠️ $ISSUES warnings (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Stylelint CSS quality | ✅ Pass (no issues found) |" >> $GITHUB_STEP_SUMMARY
          fi
          LH_URL="${{ steps.lighthouse.outputs.lighthouseData }}"
          if [ -n "$LH_URL" ]; then
            echo "| Lighthouse (Perf/SEO/A11y) | 📊 [View Report]($LH_URL) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Lighthouse (Perf/SEO/A11y) | ⚙️ Ran (see artifacts) |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_This check ran on ubuntu-latest with Node.js 20._" >> $GITHUB_STEP_SUMMARY

  # ============== JOB 2: DEPLOY — force-push root content to gh-pages branch ==============
  build-and-deploy:
    name: Auto-Deploy → gh-pages branch
    needs: quality
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy site root to gh-pages (orphan force-push)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          force_orphan: true
          keep_files: false
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_message: |
            deploy: ${{ github.event.head_commit.message }} (auto gh-pages)

            Triggered by commit ${{ github.sha }} on ${{ github.ref_name }}
            Source repo: ${{ github.repository }} via Actions Run #${{ github.run_number }}
